<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedEx Operations Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --fedex-purple: #7b42ff; 
            --fedex-purple-dark: #4d148c;
            --fedex-orange: #ff6600;
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #cbd5e1; 
            --border-color: #334155; 
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.4);
            --transition: all 0.3s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .header {
            background: #020617; 
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--fedex-orange);
            box-shadow: var(--shadow-md);
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .header p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .login-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .login-btn:hover { border-color: var(--fedex-orange); background-color: rgba(255, 102, 0, 0.1); }
        .login-btn.unlocked { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #fca5a5; }
        .login-btn.unlocked:hover { background-color: rgba(239, 68, 68, 0.2); }

        .search-bar {
            padding: 15px 20px;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .search-bar::placeholder { color: #64748b; }
        .search-bar:focus { outline: none; border-color: var(--fedex-purple); background-color: #0f172a; }

        .tab-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .tab-btn { flex: 1; min-width: 130px; padding: 14px; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; background-color: var(--card-bg); color: var(--text-muted); box-shadow: var(--shadow-sm); transition: var(--transition); }
        .tab-btn:hover { border-color: var(--fedex-orange); color: var(--text-main); }
        .tab-btn.active { background-color: var(--fedex-orange); color: white; border-color: var(--fedex-orange); box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3); }

        /* Security Lock State applied directly to body */
        body.locked-state .mgmt-restricted { display: none !important; }

        .table-container { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-md); overflow-x: auto; display: none; margin-bottom: 30px; animation: fadeIn 0.4s ease forwards; border: 1px solid var(--border-color); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .table-container.active { display: block; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #020617; color: var(--text-muted); font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #334155; }

        .action-btn { display: inline-block; padding: 8px 16px; margin: 2px 0; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; color: white; text-align: center; white-space: nowrap; }
        .phone-btn { background-color: #10b981; color: #022c22; }
        .email-btn { background-color: #3b82f6; color: #eff6ff; }
