<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FedEx Operations Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        :root {
            --fedex-purple: #7b42ff; 
            --fedex-purple-dark: #4d148c;
            --fedex-orange: #ff6600;
            --bg-color: #0f172a; 
            --card-bg: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #cbd5e1; 
            --border-color: #334155; 
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.2);
            --shadow-md: 0 8px 16px rgba(0,0,0,0.4);
            --transition: all 0.2s ease;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        .header {
            background: #020617; 
            color: white;
            padding: 25px 20px;
            text-align: center;
            border-bottom: 4px solid var(--fedex-orange);
            box-shadow: var(--shadow-md);
        }

        .header h1 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .header p {
            margin: 0;
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .login-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
            text-align: center;
        }

        .login-btn:hover { border-color: var(--fedex-orange); background-color: rgba(255, 102, 0, 0.1); }
        .login-btn.unlocked { background-color: rgba(239, 68, 68, 0.1); border-color: #ef4444; color: #fca5a5; }

        .search-bar {
            padding: 15px 20px;
            font-size: 1.05rem;
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: var(--shadow-sm);
            font-family: 'Inter', sans-serif;
        }

        .search-bar::placeholder { color: #64748b; }
        .search-bar:focus { outline: none; border-color: var(--fedex-purple); background-color: #0f172a; }

        .tab-buttons { display: flex; flex-wrap: wrap; gap: 10px; }
        .tab-btn { flex: 1; min-width: 130px; padding: 14px; font-size: 0.95rem; font-weight: 600; border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; background-color: var(--card-bg); color: var(--text-muted); transition: var(--transition); }
        .tab-btn:hover { border-color: var(--fedex-orange); color: var(--text-main); }
        .tab-btn.active { background-color: var(--fedex-orange); color: white; border-color: var(--fedex-orange); }

        /* Security Lock State applied directly to body */
        body.locked-state .mgmt-restricted { display: none !important; }

        /* Fallback explicit display rules */
        .table-container { background: var(--card-bg); border-radius: 12px; box-shadow: var(--shadow-md); overflow-x: auto; display: none; margin-bottom: 30px; border: 1px solid var(--border-color); }
        .table-container.active { display: block; opacity: 1; }

        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: #020617; color: var(--text-muted); font-weight: 800; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #334155; }

        .action-btn { display: inline-block; padding: 8px 16px; margin: 2px 0; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; color: white; text-align: center; white-space: nowrap; }
        .phone-btn { background-color: #10b981; color: #022c22; }
        .email-btn { background-color: #3b82f6; color: #eff6ff; }
        
        .schedule-title { background-color: #020617; color: var(--text-main); padding: 15px 20px; font-weight: 800; font-size: 1.1rem; border-bottom: 1px solid var(--border-color); }
        .work-day { color: #34d399; font-weight: 800; }
        .off-day { color: #f87171; font-weight: 800; }
        .tbd-day { color: #fbbf24; font-weight: 800; }

        /* Cards */
        .day-card, .note-card, .inspection-card { border: 1px solid var(--border-color); border-radius: 10px; margin: 20px; overflow: hidden; box-shadow: var(--shadow-sm); background: var(--card-bg); }
        .day-header { background-color: var(--fedex-purple-dark); color: white; padding: 15px 20px; font-size: 1.2rem; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }
        .day-count { background-color: var(--fedex-orange); color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.9rem; font-weight: 800; }
        .day-body { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .driver-badge { background-color: #334155; padding: 12px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; text-align: center; border-left: 5px solid var(--fedex-purple); color: var(--text-main); }
        .off-duty-badge { background-color: rgba(239, 68, 68, 0.1); border-left: 5px solid #ef4444; color: #fca5a5; }
        .rotator-badge { background-color: rgba(245, 158, 11, 0.1); border-left: 5px solid #f59e0b; color: #fcd34d; }
        .weekend-call-section { grid-column: 1 / -1; margin-top: 10px; padding-top: 15px; border-top: 2px dashed var(--border-color); display: flex; flex-wrap: wrap; gap: 10px; }
        .weekend-call-title { width: 100%; font-weight: bold; color: #f87171; margin-bottom: 5px; }

        /* Database Forms */
        .database-form { padding: 20px; background: #0f172a; border-bottom: 2px solid var(--border-color); }
        .db-input, .db-select, .db-textarea { width: 100%; padding: 12px; margin-bottom: 15px; background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem; box-sizing
